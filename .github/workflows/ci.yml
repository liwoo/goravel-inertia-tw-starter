name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Go Backend Jobs
  # =============================================================================

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        continue-on-error: true
        with:
          version: latest
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...
        continue-on-error: true

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create test directories
        run: |
          mkdir -p resources/views
          touch resources/views/dummy.tmpl
          mkdir -p database

      - name: Make test script executable
        run: chmod +x ./scripts/run_tests.sh

      - name: Run tests with testcontainers
        run: |
          # Note: -race disabled due to race conditions in goravel/gin middleware (upstream issue)
          ./scripts/run_tests.sh ./tests/... -timeout 600s -v -coverprofile=coverage.out -covermode=atomic

      - name: Display coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "Coverage summary:"
            go tool cover -func=coverage.out | tail -15
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-report
          path: coverage.out
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: backend
          name: go-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  go-build:
    name: Go Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -a -trimpath \
            -ldflags="-w -s -extldflags '-static'" \
            -o goravel-app .

      - name: Verify binary
        run: |
          ls -lh goravel-app
          file goravel-app

  # =============================================================================
  # Frontend Jobs
  # =============================================================================

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run ESLint
        run: npm run lint --if-present
        continue-on-error: true

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run Vitest tests
        run: npm run test -- --run --reporter=verbose
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test:coverage -- --run
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          ls -la public/
          ls -la public/js/ || true
          ls -la public/css/ || true

  # =============================================================================
  # Security Scanning
  # =============================================================================

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Audit npm dependencies
        run: npm audit --audit-level=high || true

  # =============================================================================
  # Docker Build and Scan
  # =============================================================================

  docker-build:
    name: Docker Build & Push
    needs: [go-lint, go-test, frontend-build]
    if: ${{ vars.DEPLOYABLE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME || 'books-database' }}
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      app-version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build amd64 only for scanning (faster)
      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@v5
        id: build-scan
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          platforms: linux/amd64
          # Disabled cache to ensure fresh builds include all changes
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for console output
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      # Build and push multi-platform image (only on main/develop push)
      - name: Build and push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/build-push-action@v5
        id: build-push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Disabled cache to ensure fresh builds include all changes
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

  # =============================================================================
  # Helm Chart Validation
  # =============================================================================

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Chart.yaml appVersion with package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/goravel-blog/Chart.yaml
          echo "Synced Chart.yaml appVersion to: $VERSION"
          grep appVersion helm/goravel-blog/Chart.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm chart
        run: helm lint helm/goravel-blog

      - name: Validate with staging values
        run: |
          helm template goravel-blog helm/goravel-blog \
            --values helm/goravel-blog/values.yaml \
            --values helm/goravel-blog/values.staging.yaml \
            --dry-run > /dev/null

      - name: Validate with production values
        run: |
          helm template goravel-blog helm/goravel-blog \
            --values helm/goravel-blog/values.yaml \
            --values helm/goravel-blog/values.production.yaml \
            --dry-run > /dev/null

  # =============================================================================
  # Summary Job
  # =============================================================================

  ci-success:
    name: CI Success
    needs: [go-lint, go-test, go-build, frontend-lint, frontend-test, frontend-build, docker-build, helm-lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.go-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.go-test.result }}" == "failure" ]] || \
             [[ "${{ needs.go-build.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-build.result }}" == "failure" ]] || \
             [[ "${{ needs.helm-lint.result }}" == "failure" ]]; then
            echo "One or more critical jobs failed"
            exit 1
          fi
          echo "All critical CI checks passed!"
