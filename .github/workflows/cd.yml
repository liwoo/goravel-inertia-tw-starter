name: CD

on:
  # Trigger after CI workflow completes successfully
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, develop]
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_smoke_tests:
        description: 'Skip smoke tests after deployment'
        required: false
        default: false
        type: boolean

env:
  HELM_VERSION: 'v3.14.0'
  KUBECTL_VERSION: 'v1.29.0'
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/smedi-database

# Only allow one deployment at a time per environment
concurrency:
  group: deploy-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  # =============================================================================
  # Determine Environment
  # =============================================================================

  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    # Only run if CI was successful (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      namespace: ${{ steps.env.outputs.namespace }}
      values_file: ${{ steps.env.outputs.values_file }}
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine environment
        id: env
        run: |
          # Get the branch - workflow_run uses different context
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            BRANCH="${{ github.ref }}"
          fi

          if [[ "${{ github.event.inputs.environment }}" == "production" ]] || [[ "$BRANCH" == refs/tags/v* ]] || [[ "$BRANCH" == "main" ]] || [[ "$BRANCH" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "namespace=production" >> $GITHUB_OUTPUT
            echo "values_file=values.production.yaml" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "namespace=staging" >> $GITHUB_OUTPUT
            echo "values_file=values.staging.yaml" >> $GITHUB_OUTPUT
          fi

      - name: Determine image tag
        id: tag
        run: |
          # Use version from package.json - matches CI tagging
          VERSION=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.workflow_run.head_sha || github.sha }}/package.json" | jq -r '.version')
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using image tag: ${VERSION}"

  # =============================================================================
  # Pre-deployment Checks
  # =============================================================================

  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4

      - name: Check if image exists in registry
        run: |
          echo "Checking for image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.image_tag }}"
          # Note: This will be validated during deployment

      - name: Validate Helm values
        run: |
          # Install Helm
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # Template with the target values file
          helm template goravel-blog ./helm/goravel-blog \
            --values ./helm/goravel-blog/values.yaml \
            --values ./helm/goravel-blog/${{ needs.setup.outputs.values_file }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.setup.outputs.image_tag }} \
            --dry-run > /dev/null

          echo "Helm template validation passed"

  # =============================================================================
  # Deploy
  # =============================================================================

  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, pre-deploy-checks]
    environment:
      name: ${{ needs.setup.outputs.environment }}
      url: ${{ steps.deploy-url.outputs.url }}
    outputs:
      deployment_url: ${{ steps.deploy-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure Kubernetes credentials
        run: |
          mkdir -p $HOME/.kube
          cat <<'KUBECONFIG_EOF' > $HOME/.kube/config
          ${{ secrets.KUBECONFIG }}
          KUBECONFIG_EOF
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: |
          echo "Testing cluster connection..."
          kubectl cluster-info || { echo "Failed to connect to cluster"; exit 1; }
          kubectl get nodes || { echo "Failed to get nodes"; exit 1; }
          echo "Cluster connection verified successfully"

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ needs.setup.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=docker.io \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --namespace=${{ needs.setup.outputs.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        id: helm-deploy
        run: |
          helm upgrade --install goravel-blog ./helm/goravel-blog \
            --namespace ${{ needs.setup.outputs.namespace }} \
            --values ./helm/goravel-blog/values.yaml \
            --values ./helm/goravel-blog/${{ needs.setup.outputs.values_file }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.setup.outputs.image_tag }} \
            --set imagePullSecrets[0].name=dockerhub-secret \
            --set app.version=${{ needs.setup.outputs.image_tag }} \
            --set app.database.password=${{ secrets.DB_PASSWORD }} \
            --set app.jwt.secret=${{ secrets.JWT_SECRET }} \
            --set app.key=${{ secrets.APP_KEY }} \
            --set app.redis.password=${{ secrets.REDIS_PASSWORD }} \
            --wait \
            --timeout 10m \
            --atomic

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/goravel-blog-goravel-blog \
            -n ${{ needs.setup.outputs.namespace }} \
            --timeout=5m

      - name: Run database migrations and setup
        run: |
          POD_NAME=$(kubectl get pods -n ${{ needs.setup.outputs.namespace }} \
            -l app.kubernetes.io/name=goravel-blog \
            -o jsonpath="{.items[0].metadata.name}" \
            --field-selector=status.phase=Running)

          echo "Running migrations..."
          kubectl exec -n ${{ needs.setup.outputs.namespace }} $POD_NAME -- \
            ./goravel-app artisan migrate --force

          echo "Running database seeders..."
          kubectl exec -n ${{ needs.setup.outputs.namespace }} $POD_NAME -- \
            ./goravel-app artisan db:seed --force || true

          echo "Setting up RBAC (idempotent)..."
          kubectl exec -n ${{ needs.setup.outputs.namespace }} $POD_NAME -- \
            ./goravel-app artisan rbac:setup

          echo "Creating admin user (if not exists)..."
          kubectl exec -n ${{ needs.setup.outputs.namespace }} $POD_NAME -- \
            ./goravel-app artisan user:create-admin \
              --name="${{ secrets.ADMIN_NAME }}" \
              --email="${{ secrets.ADMIN_EMAIL }}" \
              --password="${{ secrets.ADMIN_PASSWORD }}" \
              --skip-existing

      - name: Get deployment URL
        id: deploy-url
        run: |
          INGRESS_HOST=$(kubectl get ingress -n ${{ needs.setup.outputs.namespace }} \
            -l app.kubernetes.io/name=goravel-blog \
            -o jsonpath="{.items[0].spec.rules[0].host}" 2>/dev/null || echo "")

          if [ -n "$INGRESS_HOST" ]; then
            echo "url=https://${INGRESS_HOST}" >> $GITHUB_OUTPUT
          else
            echo "url=https://${{ needs.setup.outputs.environment }}.example.com" >> $GITHUB_OUTPUT
          fi

      - name: Display deployment info
        run: |
          echo "=== Deployment Summary ==="
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Namespace: ${{ needs.setup.outputs.namespace }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.image_tag }}"
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ needs.setup.outputs.namespace }} -l app.kubernetes.io/name=goravel-blog
          echo ""
          echo "=== Services ==="
          kubectl get services -n ${{ needs.setup.outputs.namespace }} -l app.kubernetes.io/name=goravel-blog
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n ${{ needs.setup.outputs.namespace }}

  # =============================================================================
  # Post-deployment Validation
  # =============================================================================

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: ${{ !inputs.skip_smoke_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health check
        run: |
          DEPLOY_URL="${{ needs.deploy.outputs.deployment_url }}"

          echo "Testing health endpoint at ${DEPLOY_URL}/health"

          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/health" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi

            echo "Attempt $i: HTTP $HTTP_CODE - Retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 10 attempts"
          exit 1
        continue-on-error: true

      - name: Ready check
        run: |
          DEPLOY_URL="${{ needs.deploy.outputs.deployment_url }}"

          echo "Testing ready endpoint at ${DEPLOY_URL}/ready"

          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/ready" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Ready check passed!"
              exit 0
            fi

            echo "Attempt $i: HTTP $HTTP_CODE - Retrying in 10s..."
            sleep 10
          done

          echo "Ready check failed after 5 attempts"
          exit 1
        continue-on-error: true

      - name: Basic API test
        run: |
          DEPLOY_URL="${{ needs.deploy.outputs.deployment_url }}"

          echo "Testing API endpoint at ${DEPLOY_URL}/"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/" || echo "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "API test passed! (HTTP $HTTP_CODE)"
          else
            echo "API test warning: HTTP $HTTP_CODE"
          fi
        continue-on-error: true

  # =============================================================================
  # Rollback (manual trigger or on failure)
  # =============================================================================

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: failure()
    steps:
      - name: Configure Kubernetes credentials
        run: |
          mkdir -p $HOME/.kube
          cat <<'KUBECONFIG_EOF' > $HOME/.kube/config
          ${{ secrets.KUBECONFIG }}
          KUBECONFIG_EOF
          chmod 600 $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Rollback Helm release
        run: |
          echo "Rolling back goravel-blog in namespace ${{ needs.setup.outputs.namespace }}"
          helm rollback goravel-blog -n ${{ needs.setup.outputs.namespace }} || true

      - name: Verify rollback
        run: |
          kubectl rollout status deployment/goravel-blog-goravel-blog \
            -n ${{ needs.setup.outputs.namespace }} \
            --timeout=5m || true

      - name: Display rollback status
        run: |
          echo "=== Current State After Rollback ==="
          kubectl get pods -n ${{ needs.setup.outputs.namespace }} -l app.kubernetes.io/name=goravel-blog
          echo ""
          helm history goravel-blog -n ${{ needs.setup.outputs.namespace }} | tail -5
