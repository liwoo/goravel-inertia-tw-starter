        - 20
        - 30
        - 50
        - 100
        in: query
        name: pageSize
        type: integer
      - description: Search query
        in: query
        name: search
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Sort direction
        enum:
        - ASC
        - DESC
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
