host: localhost:3000
info:
  contact:
    email: support@library.com
    name: API Support
  description: |-
    A comprehensive library management system API with books, lenders, users, roles, and permissions management.
    Supports JWT authentication, role-based access control, and scoped permissions.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Library Management API
  version: "1.0"
