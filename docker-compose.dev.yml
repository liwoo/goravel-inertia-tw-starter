# =============================================================================
# Docker Compose for Local Development with Hot Reload
# =============================================================================
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.dev.yml logs -f app
# =============================================================================

name: smedi-database-dev

services:
  # ===========================================================================
  # Go Backend with Air (Hot Reload)
  # ===========================================================================
  backend:
    image: golang:1.24-alpine
    working_dir: /app
    command: >
      sh -c "
        go install github.com/air-verse/air@latest &&
        air -c .air.toml
      "
    ports:
      - "3000:3000"
    environment:
      # Application
      APP_NAME: "SMEDI Database"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:3000"
      APP_KEY: "base64:local-development-key-change-in-prod"
      APP_TIMEZONE: "UTC"
      HTTP_HOST: "0.0.0.0:3000"

      # Database (PostgreSQL)
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: smedi_db
      DB_USERNAME: smedi
      DB_PASSWORD: smedi_password

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0

      # Session
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "true"

      # JWT
      JWT_SECRET: "local-jwt-secret-change-in-production"
      JWT_TTL: 60
      JWT_REFRESH_TTL: 20160

      # Logging
      LOG_LEVEL: debug
      LOG_CHANNEL: stack
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smedi-network-dev

  # ===========================================================================
  # Vite Frontend Dev Server
  # ===========================================================================
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      VITE_APP_URL: "http://localhost:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    networks:
      - smedi-network-dev

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smedi_db
      POSTGRES_USER: smedi
      POSTGRES_PASSWORD: smedi_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smedi -d smedi_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smedi-network-dev

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smedi-network-dev

  # ===========================================================================
  # pgAdmin (Database Management)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools
    networks:
      - smedi-network-dev

  # ===========================================================================
  # Redis Commander (Cache Management)
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools
    networks:
      - smedi-network-dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data-dev:
    driver: local
  redis-data-dev:
    driver: local
  go-mod-cache:
    driver: local
  go-build-cache:
    driver: local
  node-modules:
    driver: local
  pgadmin-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  smedi-network-dev:
    driver: bridge
