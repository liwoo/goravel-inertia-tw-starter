# =============================================================================
# Docker Compose for Integration Testing
# =============================================================================
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   docker-compose -f docker-compose.test.yml run --rm test
#   docker-compose -f docker-compose.test.yml down -v
# =============================================================================

name: smedi-database-test

services:
  # ===========================================================================
  # Test Runner
  # ===========================================================================
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: go-builder
    working_dir: /app
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 5 &&
        echo 'Running Go tests...' &&
        go test -v -race -coverprofile=coverage.out ./tests/... &&
        echo 'Tests completed!'
      "
    environment:
      # Application
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: "base64:test-key-for-testing-purposes-only"

      # Database (PostgreSQL)
      DB_CONNECTION: postgres
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_DATABASE: smedi_test
      DB_USERNAME: smedi_test
      DB_PASSWORD: smedi_test_password

      # Redis
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_DATABASE: 15

      # Testing
      CGO_ENABLED: 0
    volumes:
      - .:/app
      - go-mod-cache-test:/go/pkg/mod
      - test-coverage:/app/coverage
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - smedi-network-test

  # ===========================================================================
  # Frontend Test Runner
  # ===========================================================================
  frontend-test:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "
        npm ci &&
        echo 'Running frontend tests...' &&
        npm run test -- --run --reporter=verbose &&
        echo 'Frontend tests completed!'
      "
    volumes:
      - .:/app
      - node-modules-test:/app/node_modules
    networks:
      - smedi-network-test

  # ===========================================================================
  # PostgreSQL Test Database
  # ===========================================================================
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smedi_test
      POSTGRES_USER: smedi_test
      POSTGRES_PASSWORD: smedi_test_password
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smedi_test -d smedi_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - smedi-network-test

  # ===========================================================================
  # Redis Test Instance
  # ===========================================================================
  redis-test:
    image: redis:7-alpine
    command: redis-server --appendonly no
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - smedi-network-test

  # ===========================================================================
  # End-to-End Test Runner (Playwright)
  # ===========================================================================
  e2e-test:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    working_dir: /app
    command: >
      sh -c "
        npm ci &&
        npx playwright install --with-deps &&
        npx playwright test
      "
    environment:
      BASE_URL: "http://app-test:3000"
      CI: "true"
    volumes:
      - .:/app
      - node-modules-e2e:/app/node_modules
    depends_on:
      app-test:
        condition: service_healthy
    profiles:
      - e2e
    networks:
      - smedi-network-test

  # ===========================================================================
  # Application for E2E Testing
  # ===========================================================================
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_URL: "http://app-test:3000"
      APP_KEY: "base64:test-key-for-testing-purposes-only"
      HTTP_HOST: "0.0.0.0:3000"

      # Database
      DB_CONNECTION: postgres
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_DATABASE: smedi_test
      DB_USERNAME: smedi_test
      DB_PASSWORD: smedi_test_password

      # Redis
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_DATABASE: 15
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    profiles:
      - e2e
    networks:
      - smedi-network-test

# =============================================================================
# Volumes
# =============================================================================
volumes:
  go-mod-cache-test:
    driver: local
  node-modules-test:
    driver: local
  node-modules-e2e:
    driver: local
  test-coverage:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  smedi-network-test:
    driver: bridge
