version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"  # Goravel app
      - "5173:5173"  # Vite dev server
    volumes:
      - .:/app
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:3000
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=goravel
      - DB_USERNAME=goravel
      - DB_PASSWORD=secret
      - VITE_HOST=0.0.0.0
    depends_on:
      - db
      - redis
    networks:
      - goravel

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=goravel
      - MYSQL_USER=goravel
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root_secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - goravel

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - goravel

volumes:
  db_data:

networks:
  goravel:
    driver: bridge