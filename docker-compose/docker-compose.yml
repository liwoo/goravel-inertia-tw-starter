# =============================================================================
# Docker Compose for Books Database - Local Development
# =============================================================================
# Usage:
#   cd docker-compose
#   docker compose up -d                    # Start all services
#   docker compose up -d --build            # Rebuild and start
#   docker compose down                     # Stop all services
#   docker compose down -v                  # Stop and remove volumes
#   docker compose logs -f app              # Follow app logs
#
# Optional services (using profiles):
#   docker compose --profile storage up -d  # Include MinIO
#   docker compose --profile mail up -d     # Include Mailhog
#   docker compose --profile tools up -d    # Include pgAdmin & Redis Commander
# =============================================================================

name: books-database

services:
  # ===========================================================================
  # Application Service
  # ===========================================================================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.24"
        NODE_VERSION: "20"
    container_name: books-app
    ports:
      - "3000:3000"
    environment:
      # Application
      APP_NAME: "Books Database"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:3000"
      APP_KEY: "base64:local-development-key-change-in-prod"
      APP_TIMEZONE: "UTC"
      HTTP_HOST: "0.0.0.0:3000"

      # Database (PostgreSQL)
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: books_db
      DB_USERNAME: books
      DB_PASSWORD: books_password
      DB_SSLMODE: disable
      DB_POOL_MAX: 25
      DB_POOL_MIN: 5

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0

      # Session
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "true"

      # Cache
      CACHE_DRIVER: redis
      CACHE_PREFIX: books

      # JWT
      JWT_SECRET: "local-jwt-secret-change-in-production"
      JWT_TTL: 60
      JWT_REFRESH_TTL: 20160

      # Logging
      LOG_LEVEL: debug
      LOG_CHANNEL: stack
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - books-network

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: books-postgres
    environment:
      POSTGRES_DB: books_db
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - books-network

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: books-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - books-network

  # ===========================================================================
  # MinIO Object Storage (Optional - for S3-compatible storage)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: books-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - storage
    networks:
      - books-network

  # ===========================================================================
  # Mailhog (Email Testing)
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: books-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped
    profiles:
      - mail
    networks:
      - books-network

  # ===========================================================================
  # pgAdmin (Database Management)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: books-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - tools
    networks:
      - books-network

  # ===========================================================================
  # Redis Commander (Cache Management)
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: books-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - tools
    networks:
      - books-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  minio-data:
    driver: local
  pgadmin-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  books-network:
    driver: bridge
