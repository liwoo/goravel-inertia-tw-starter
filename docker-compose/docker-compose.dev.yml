# =============================================================================
# Docker Compose Override for Development with Hot Reload
# =============================================================================
# Usage:
#   cd docker-compose
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# This override provides:
#   - Hot reloading for Go backend (using Air)
#   - Vite dev server for frontend
#   - Source code mounted for live changes
# =============================================================================

name: books-database-dev

services:
  # ===========================================================================
  # Go Backend with Air (Hot Reload)
  # ===========================================================================
  backend:
    image: golang:1.24-alpine
    container_name: books-backend-dev
    working_dir: /app
    command: >
      sh -c "
        go install github.com/air-verse/air@latest &&
        air -c .air.toml
      "
    ports:
      - "3000:3000"
    environment:
      # Application
      APP_NAME: "Books Database"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:3000"
      APP_KEY: "base64:local-development-key-change-in-prod"
      APP_TIMEZONE: "UTC"
      HTTP_HOST: "0.0.0.0:3000"

      # Database (PostgreSQL)
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: books_db
      DB_USERNAME: books
      DB_PASSWORD: books_password

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0

      # Session
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "true"

      # JWT
      JWT_SECRET: "local-jwt-secret-change-in-production"
      JWT_TTL: 60
      JWT_REFRESH_TTL: 20160

      # Logging
      LOG_LEVEL: debug
      LOG_CHANNEL: stack
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - books-network-dev

  # ===========================================================================
  # Vite Frontend Dev Server
  # ===========================================================================
  frontend:
    image: node:20-alpine
    container_name: books-frontend-dev
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      VITE_APP_URL: "http://localhost:3000"
    volumes:
      - ..:/app
      - node-modules:/app/node_modules
    networks:
      - books-network-dev

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: books-postgres-dev
    environment:
      POSTGRES_DB: books_db
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - books-network-dev

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: books-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - books-network-dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data-dev:
    driver: local
  redis-data-dev:
    driver: local
  go-mod-cache:
    driver: local
  go-build-cache:
    driver: local
  node-modules:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  books-network-dev:
    driver: bridge
