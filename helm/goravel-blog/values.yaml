# Default values for goravel-blog.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: goravel-blog
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: blog.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: blog-tls-secret
  #    hosts:
  #      - blog.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
app:
  name: "Goravel Blog"
  env: "production"
  key: "" # Will be auto-generated if not provided
  debug: false
  url: "https://blog.example.com"
  
  # Database configuration
  database:
    connection: "mysql"
    host: "mysql.default.svc.cluster.local"
    port: 3306
    database: "goravel_blog"
    username: "goravel"
    password: "" # Should be provided via --set or secrets
    charset: "utf8mb4"
    
  # Redis configuration
  redis:
    enabled: true
    host: "redis.default.svc.cluster.local"
    port: 6379
    password: ""
    
  # JWT configuration
  jwt:
    secret: "" # Will be auto-generated if not provided
    ttl: 60
    refresh_ttl: 20160
    
  # Storage configuration
  storage:
    persistence:
      enabled: true
      storageClass: "standard"
      accessMode: ReadWriteOnce
      size: 10Gi
      
  # Session configuration
  session:
    driver: "cookie"
    lifetime: 120
    encrypt: true
    
  # Mail configuration
  mail:
    enabled: false
    mailer: "smtp"
    host: "smtp.example.com"
    port: 587
    username: ""
    password: ""
    encryption: "tls"
    from_address: "noreply@blog.example.com"
    from_name: "Goravel Blog"

# Health checks
healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1