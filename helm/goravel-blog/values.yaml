# =============================================================================
# Default values for goravel-blog Helm chart
# =============================================================================
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  # Note: Repository will be overridden by CI/CD with DOCKERHUB_USERNAME secret
  repository: smedi/smedi-database
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Database Migrations
# =============================================================================
migrations:
  # Enable to run migrations as an init container before the app starts
  # Runs: migrate, db:seed, rbac:setup
  enabled: false
  # Set to true to create admin user during first deployment
  createAdmin: false

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

# =============================================================================
# Pod Configuration
# =============================================================================
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# =============================================================================
# Service Configuration
# =============================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# =============================================================================
# Ingress Configuration
# =============================================================================
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
  hosts:
    - host: smedi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# Resource Limits
# =============================================================================
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# =============================================================================
# Node Selection
# =============================================================================
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - goravel-blog
          topologyKey: kubernetes.io/hostname

# =============================================================================
# Application Configuration
# =============================================================================
app:
  name: "SMEDI Database"
  env: "production"
  key: ""  # Will be auto-generated if not provided
  debug: false
  url: "https://smedi.example.com"
  timezone: "UTC"
  version: ""  # Set via CI/CD from package.json, falls back to Chart.AppVersion

  # Database configuration (PostgreSQL via PgBouncer)
  database:
    connection: "postgres"
    host: "my-pgbouncer.doorbell.svc.cluster.local"
    port: 5432
    database: "smedi_db"
    username: "admin"
    password: ""  # Set via secrets: DATABASE_PASSWORD
    sslmode: "disable"
    pool:
      max: 450
      min: 0

  # Redis configuration
  redis:
    enabled: true
    host: "redis-master.data.svc.cluster.local"
    port: 6379
    password: ""  # Set via secrets: REDIS_PASSWORD
    database: 0
    ttl: 86400

  # JWT configuration
  jwt:
    secret: ""  # Will be auto-generated if not provided
    ttl: 60
    refresh_ttl: 20160

  # Storage configuration
  storage:
    persistence:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 10Gi

  # Session configuration
  session:
    driver: "redis"
    lifetime: 120
    encrypt: true

  # Mail configuration
  mail:
    enabled: false
    mailer: "smtp"
    host: "smtp.example.com"
    port: 587
    username: ""
    password: ""
    encryption: "tls"
    from_address: "noreply@smedi.example.com"
    from_name: "SMEDI"

  # Logging configuration
  logging:
    level: "info"
    channel: "stack"

# =============================================================================
# Health Checks
# =============================================================================
healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
    successThreshold: 1

# =============================================================================
# Pod Disruption Budget
# =============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# =============================================================================
# Network Policy
# =============================================================================
networkPolicy:
  enabled: true
  ingress:
    enabled: true
    # Allow traffic from nginx ingress controller
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - podSelector: {}  # Allow traffic from same namespace
  egress:
    enabled: true
    # Allow DNS resolution
    to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      # Allow traffic to PostgreSQL
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
      # Allow traffic to Redis
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data

# =============================================================================
# Service Monitor (Prometheus)
# =============================================================================
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}

# =============================================================================
# Extra Environment Variables
# =============================================================================
extraEnv: []
# - name: EXTRA_VAR
#   value: "value"

extraEnvFrom: []
# - secretRef:
#     name: extra-secrets

# =============================================================================
# Init Containers
# =============================================================================
initContainers: []

# =============================================================================
# Sidecar Containers
# =============================================================================
sidecars: []

# =============================================================================
# Extra Volumes
# =============================================================================
extraVolumes: []

extraVolumeMounts: []
