apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goravel-blog.fullname" . }}
  labels:
    {{- include "goravel-blog.labels" . | nindent 4 }}
data:
  # Application configuration
  APP_NAME: {{ .Values.app.name | quote }}
  APP_ENV: {{ .Values.app.env | quote }}
  APP_DEBUG: {{ .Values.app.debug | quote }}
  APP_URL: {{ .Values.app.url | quote }}
  APP_TIMEZONE: {{ .Values.app.timezone | default "UTC" | quote }}
  APP_VERSION: {{ .Values.app.version | default .Chart.AppVersion | quote }}

  # Database configuration (PostgreSQL via PgBouncer)
  DB_CONNECTION: {{ .Values.app.database.connection | quote }}
  DB_HOST: {{ .Values.app.database.host | quote }}
  DB_PORT: {{ .Values.app.database.port | quote }}
  DB_DATABASE: {{ .Values.app.database.database | quote }}
  DB_USERNAME: {{ .Values.app.database.username | quote }}
  DB_SSLMODE: {{ .Values.app.database.sslmode | default "disable" | quote }}
  {{- if .Values.app.database.pool }}
  DB_POOL_MAX: {{ .Values.app.database.pool.max | default 100 | quote }}
  DB_POOL_MIN: {{ .Values.app.database.pool.min | default 0 | quote }}
  {{- end }}

  # Redis configuration
  {{- if .Values.app.redis.enabled }}
  REDIS_HOST: {{ .Values.app.redis.host | quote }}
  REDIS_PORT: {{ .Values.app.redis.port | quote }}
  REDIS_DATABASE: {{ .Values.app.redis.database | default 0 | quote }}
  {{- if .Values.app.redis.ttl }}
  REDIS_TTL: {{ .Values.app.redis.ttl | quote }}
  {{- end }}
  {{- end }}

  # JWT configuration
  JWT_TTL: {{ .Values.app.jwt.ttl | quote }}
  JWT_REFRESH_TTL: {{ .Values.app.jwt.refresh_ttl | quote }}

  # Auth configuration
  {{- if .Values.app.auth }}
  AUTH_REQUIRE_2FA: {{ .Values.app.auth.require_2fa | default true | quote }}
  {{- end }}

  # Session configuration
  SESSION_DRIVER: {{ .Values.app.session.driver | quote }}
  SESSION_LIFETIME: {{ .Values.app.session.lifetime | quote }}
  SESSION_ENCRYPT: {{ .Values.app.session.encrypt | quote }}

  # Mail configuration
  {{- if .Values.app.mail.enabled }}
  MAIL_MAILER: {{ .Values.app.mail.mailer | quote }}
  MAIL_HOST: {{ .Values.app.mail.host | quote }}
  MAIL_PORT: {{ .Values.app.mail.port | quote }}
  MAIL_USERNAME: {{ .Values.app.mail.username | quote }}
  MAIL_ENCRYPTION: {{ .Values.app.mail.encryption | quote }}
  MAIL_FROM_ADDRESS: {{ .Values.app.mail.from_address | quote }}
  MAIL_FROM_NAME: {{ .Values.app.mail.from_name | quote }}
  {{- end }}

  # Goravel specific
  APP_HOST: "0.0.0.0"
  APP_PORT: "3000"
  GRPC_HOST: ""

  # Logging configuration
  LOG_LEVEL: {{ .Values.app.logging.level | default "info" | quote }}
  LOG_CHANNEL: {{ .Values.app.logging.channel | default "stack" | quote }}

  # Inertia/Frontend
  VITE_APP_URL: {{ .Values.app.url | quote }}
