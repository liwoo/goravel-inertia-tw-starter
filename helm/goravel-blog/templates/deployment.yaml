apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goravel-blog.fullname" . }}
  labels:
    {{- include "goravel-blog.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "goravel-blog.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "goravel-blog.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "goravel-blog.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.migrations.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.migrations.enabled }}
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database migrations..."
              /app/goravel-app artisan migrate --force
              echo "Running database seeders..."
              /app/goravel-app artisan db:seed --force || true
              echo "Setting up RBAC..."
              /app/goravel-app artisan rbac:setup
              {{- if .Values.migrations.createAdmin }}
              echo "Creating admin user..."
              /app/goravel-app artisan user:create-admin \
                --name="${ADMIN_NAME}" \
                --email="${ADMIN_EMAIL}" \
                --password="${ADMIN_PASSWORD}" || true
              {{- end }}
              echo "Database setup complete!"
          envFrom:
            - configMapRef:
                name: {{ include "goravel-blog.fullname" . }}
            - secretRef:
                name: {{ include "goravel-blog.fullname" . }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.healthcheck.enabled }}
          {{- if .Values.healthcheck.startupProbe }}
          startupProbe:
            {{- toYaml .Values.healthcheck.startupProbe | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.healthcheck.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.healthcheck.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "goravel-blog.fullname" . }}
            - secretRef:
                name: {{ include "goravel-blog.fullname" . }}
          {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            {{- if .Values.app.storage.persistence.enabled }}
            - name: persistent-storage
              mountPath: /app/storage/app
              subPath: app
            - name: persistent-storage
              mountPath: /app/storage/logs
              subPath: logs
            - name: persistent-storage
              mountPath: /app/storage/framework
              subPath: framework
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: storage
          emptyDir: {}
        {{- if .Values.app.storage.persistence.enabled }}
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: {{ include "goravel-blog.fullname" . }}-storage
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
