apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goravel-blog.fullname" . }}
  labels:
    {{- include "goravel-blog.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.app.key }}
  APP_KEY: {{ .Values.app.key | b64enc | quote }}
  {{- else }}
  APP_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  # Database password
  DB_PASSWORD: {{ .Values.app.database.password | b64enc | quote }}
  
  # Redis password
  {{- if .Values.app.redis.enabled }}
  REDIS_PASSWORD: {{ .Values.app.redis.password | b64enc | quote }}
  {{- end }}
  
  # JWT secret
  {{- if .Values.app.jwt.secret }}
  JWT_SECRET: {{ .Values.app.jwt.secret | b64enc | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  
  # Mail password
  {{- if .Values.app.mail.enabled }}
  MAIL_PASSWORD: {{ .Values.app.mail.password | b64enc | quote }}
  {{- end }}