# =============================================================================
# Staging environment values for goravel-blog
# =============================================================================

replicaCount: 1

# Run database migrations before app starts
migrations:
  enabled: true
  createAdmin: true

image:
  pullPolicy: Always

ingress:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: smedi.dartsmw.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: smedi-dartsmw-tls
      hosts:
        - smedi.dartsmw.com

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

app:
  env: "staging"
  debug: true
  url: "https://smedi.dartsmw.com"

  database:
    connection: "postgres"
    host: "my-pgbouncer.doorbell.svc.cluster.local"
    port: 5432
    database: "smedi_db"
    username: "admin"
    password: "postgrespw"
    sslmode: "disable"
    pool:
      max: 450
      min: 0

  redis:
    enabled: true
    host: "redis-master.data.svc.cluster.local"
    password: "ErMAXAXYYX"
    port: 6379
    database: 0
    ttl: 86400

  session:
    driver: "redis"

  admin:
    name: "Admin"
    email: "admin@dartsmw.com"
    password: "changeme123"  # Change this!

  logging:
    level: "debug"

  storage:
    persistence:
      enabled: false

healthcheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
