# =============================================================================
# Staging environment values for goravel-blog
# =============================================================================

replicaCount: 1

image:
  pullPolicy: Always

ingress:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: staging-smedi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

app:
  env: "staging"
  debug: true
  url: "https://staging-smedi.example.com"

  database:
    connection: "postgres"
    host: "my-pgbouncer.doorbell.svc.cluster.local"
    port: 5432
    database: "smedi_db"
    username: "admin"
    sslmode: "disable"
    pool:
      max: 450
      min: 0

  redis:
    enabled: true
    host: "redis-master.data.svc.cluster.local"
    port: 6379
    database: 0
    ttl: 86400

  session:
    driver: "redis"

  logging:
    level: "debug"

  storage:
    persistence:
      enabled: false

# Memory optimization for Go runtime
extraEnv:
  - name: GOMAXPROCS
    value: "1"
  - name: GOGC
    value: "50"
  - name: GOMEMLIMIT
    value: "70MiB"

healthcheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
